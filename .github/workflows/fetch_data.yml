name: Fetch SOXX/QQQ + KR ETF + extra stocks (SPY/MU/삼성전자/SK하이닉스/농심) + reference indices (SOX/VIX/TNX/WTI/DXY/KRW/DJI/DJT/GSPC/IRX/HYG/LQD/IEF) + FRED macro data

on:
  schedule:
    # 한국시간(KST, UTC+9) 기준 월~토 실행. GitHub 예약 실행은 정각(:00)에 몰려 수 시간 지연/누락되는 일이 있어
    # 정각을 피한 분 단위로 여러 번 실행합니다. 데이터가 안 바뀌면 커밋을 생략하므로 여러 번 돌아도 안전합니다.
    # (미국 정규장 마감: 겨울 06:00 KST / 여름 05:00 KST)
    - cron: "37 21 * * 0-5"   # KST 06:37 (월~토)
    - cron: "23 22 * * 0-5"   # KST 07:23 (월~토)
    - cron: "47 23 * * 0-5"   # KST 08:47 (월~토)
    - cron: "13 1 * * 1-6"    # KST 10:13 (월~토)
    - cron: "37 3 * * 1-6"    # KST 12:37 (월~토)
    - cron: "17 7 * * 1-6"    # KST 16:17 (월~토)
  workflow_dispatch: {}   # 저장소 Actions 탭에서 "Run workflow"로 수동 실행도 가능

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write   # 받아온 데이터 파일을 저장소에 커밋하기 위해 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install --upgrade yfinance pandas

      - name: fetch_data.py 실행 (SOXX/QQQ + 국내 ETF + 추가종목 + 참고지표 + FRED 거시지표 데이터 다운로드)
        run: python fetch_data.py

      - name: 변경된 데이터 파일 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 지표 중 일부가 그날 받아오지 못해 파일이 생성되지 않았더라도(휴장일, 일시적 접속 오류 등)
          # 나머지 파일들은 정상적으로 커밋되도록 파일 하나씩 개별적으로 add 하고, 없는 파일은 조용히 건너뜁니다.
          for f in merged_data.json merged_data.csv merged_data_recent20.json \
            kr_etf_data.json kr_etf_data_recent20.json \
            extra_stocks_data.json extra_stocks_data_recent20.json \
            ref_index_data.json ref_index_data_recent20.json \
            fred_data.json fred_data_recent20.json \
            soxx_raw.csv qqq_raw.csv \
            kr_381180_raw.csv kr_426030_raw.csv \
            extra_spy_raw.csv extra_mu_raw.csv extra_ibb_raw.csv extra_005930_raw.csv extra_000660_raw.csv extra_004370_raw.csv \
            ref_sox_raw.csv ref_vix_raw.csv ref_tnx_raw.csv ref_wti_raw.csv ref_dxy_raw.csv ref_krw_raw.csv \
            ref_dji_raw.csv ref_djt_raw.csv ref_gspc_raw.csv ref_irx_raw.csv ref_hyg_raw.csv ref_lqd_raw.csv ref_ief_raw.csv \
            fred_sahm_raw.csv fred_leading_raw.csv fred_t10y2y_raw.csv fred_t10y3m_raw.csv fred_hyspread_raw.csv fred_unrate_raw.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && echo "변경 없음 (휴장일 등) - 커밋 생략" || git commit -m "자동 데이터 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push
