name: Fetch SOXX/QQQ + KR ETF data

on:
  schedule:
    - cron: "0 22 * * 0-5"   # KST 07:00 (월~토)
    - cron: "0 23 * * 0-5"   # KST 08:00 (월~토)
    - cron: "0 3 * * 1-6"    # KST 12:00 (월~토)
    - cron: "0 7 * * 1-6"    # KST 16:00 (월~토)
  workflow_dispatch: {}

# 동시 실행 시 충돌 방지
concurrency:
  group: fetch-data-job
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pull/rebase를 위해 전체 이력 가져오기

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install --upgrade yfinance pandas

      - name: fetch_data.py 실행 (SOXX/QQQ + 국내 ETF 데이터 다운로드)
        run: python fetch_data.py

      - name: 변경된 데이터 파일 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged_data.json merged_data.csv merged_data_recent20.json kr_etf_data.json kr_etf_data_recent20.json soxx_raw.csv qqq_raw.csv kr_381180_raw.csv kr_426030_raw.csv
          if ! git diff --cached --quiet; then
            git commit -m "자동 데이터 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "변경 없음 (휴장일 등) - 커밋 생략"
          fi
