name: Fetch SOXX/QQQ + KR ETF + reference indices (SOX/VIX/TNX) data

on:
  schedule:
    # 한국시간(KST, UTC+9) 기준 월~토 07:00 / 08:00 / 12:00 / 16:00 에 자동 실행
    # (요일 숫자는 UTC 기준 요일이라 KST와 다를 수 있어 각 줄마다 변환해 두었습니다)
    - cron: "0 22 * * 0-5"   # KST 07:00 (월~토)
    - cron: "0 23 * * 0-5"   # KST 08:00 (월~토)
    - cron: "0 3 * * 1-6"    # KST 12:00 (월~토)
    - cron: "0 7 * * 1-6"    # KST 16:00 (월~토)
  workflow_dispatch: {}   # 저장소 Actions 탭에서 "Run workflow"로 수동 실행도 가능

permissions:
  contents: write   # 받아온 데이터 파일을 저장소에 커밋하기 위해 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install --upgrade yfinance pandas

      - name: fetch_data.py 실행 (SOXX/QQQ + 국내 ETF + 참고지표(SOX/VIX/TNX) 데이터 다운로드)
        run: python fetch_data.py

      - name: 변경된 데이터 파일 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged_data.json merged_data.csv merged_data_recent20.json kr_etf_data.json kr_etf_data_recent20.json ref_index_data.json ref_index_data_recent20.json soxx_raw.csv qqq_raw.csv kr_381180_raw.csv kr_426030_raw.csv ref_sox_raw.csv ref_vix_raw.csv ref_tnx_raw.csv
          git diff --cached --quiet && echo "변경 없음 (휴장일 등) - 커밋 생략" || git commit -m "자동 데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
